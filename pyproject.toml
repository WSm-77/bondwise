[project]
name = "bondwise"
version = "0.1.0"
description = "EDO vs COI retail bond profit simulator"
readme = "README.md"
authors = [
    { name = "Wiktor Sędzimir", email = "wiktor.sedzimir@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
